<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zona Trisula</title>
  <style>
    /* Mengatur elemen dasar */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Mengatur tampilan body untuk menempatkan konten di tengah layar */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #0d0d0d;
      font-family: 'Arial', sans-serif;
    }

    /* Mengatur container agar teks dan tombol berada di tengah dan berwarna putih */
    .container {
      text-align: center;
      color: white;
    }

    /* Efek neon pada teks */
    .neon {
      font-size: 8vw; /* Menggunakan vw agar teks responsif */
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 8px;
      color: #fff;
      text-shadow: 
        0 0 5px #00ffea,
        0 0 10px #00ffea,
        0 0 20px #00ffea,
        0 0 30px #00ffea,
        0 0 40px #f0f,
        0 0 70px #f0f,
        0 0 80px #f0f;
      animation: neon-flicker 1.5s infinite alternate;
      margin-bottom: 30px; /* Menambahkan jarak di bawah teks */
      text-align: center; /* Agar teks rata tengah */
    }

    /* Animasi flicker untuk teks neon */
    @keyframes neon-flicker {
      0%, 100% {
        text-shadow: 
          0 0 5px #00ffea,
          0 0 10px #00ffea,
          0 0 20px #00ffea,
          0 0 30px #00ffea,
          0 0 40px #f0f,
          0 0 70px #f0f,
          0 0 80px #f0f;
      }
      50% {
        text-shadow: 
          0 0 8px #00ffea,
          0 0 15px #00ffea,
          0 0 25px #00ffea,
          0 0 35px #00ffea,
          0 0 50px #f0f,
          0 0 90px #f0f,
          0 0 100px #f0f;
      }
    }

    /* Mengatur jarak atas untuk container tombol */
    .button-container {
      margin-top: 30px;
    }

    /* Mengatur gaya tombol */
    .btn {
      background: none;
      color: #9400D3;
      padding: 12px 25px;
      margin: 15px;
      font-size: 18px;
      border: 2px solid #FF00FF;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.4s, border-color 0.4s, color 0.4s;
    }

    /* Efek hover pada tombol */
    .btn:hover {
      background-color: #000000;
      border-color: #00FFFF;
      color: #7CFC00;
    }

  </style>
</head>
<body>

  <div class="container">
    <!-- Teks dengan efek neon, ukuran teks responsif -->
    <div class="neon">Pagar nusa</div>
    <!-- Kontainer tombol dengan tautan -->
    <div class="button-container">
      <a href="https://zikameki.github.io/gotri-image/"><button class="btn">Photo</button></a>
      <a href="https://zikameki.github.io/gotri-video/"><button class="btn">Video</button></a>
      <a href="https://zikameki.github.io/gotri-audio/"><button class="btn">Audio</button></a>
    </div>
  </div>

</body>
</html>
